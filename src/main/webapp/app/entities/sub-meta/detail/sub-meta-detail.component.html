<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (subMeta(); as subMetaRef) {
      <div>
        <h2 data-cy="subMetaDetailsHeading"><span>Sub Meta</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>Código</span></dt>
          <dd>
            <span>{{ subMetaRef.id }}</span>
          </dd>
          <dt><span>Descricao</span></dt>
          <dd>
            <span>{{ subMetaRef.descricao }}</span>
          </dd>
          <dt><span>Concluida</span></dt>
          <dd>
            <span>{{ subMetaRef.concluida }}</span>
          </dd>
          <dt><span>Data Limite</span></dt>
          <dd>
            <span>{{ subMetaRef.dataLimite | formatMediumDate }}</span>
          </dd>
          <dt><span>Meta</span></dt>
          <dd>
            @if (subMeta()!.meta) {
              <div>
                <a [routerLink]="['/meta', subMeta()!.meta?.id, 'view']">{{ subMetaRef.meta?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Voltar</span>
        </button>

        <button type="button" [routerLink]="['/sub-meta', subMetaRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Editar</span>
        </button>
      </div>
    }
  </div>
</div>
